<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 5 - Users API</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 20px auto; padding: 15px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    #filter-input { width: 100%; padding: 8px; margin: 15px 0; }
    #users-list { list-style: none; padding: 0; }
    #users-list li { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 6px; }
    #status { font-weight: bold; min-height: 20px; }
    button { padding: 8px 16px; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
  <script src="users.js" defer></script>
</head>
<body>
  <header>
    <h1>Users Directory</h1>
    <button id="load-users">Load Users</button>
  </header>

  <main>
    <label for="filter-input">Filter by name:</label>
    <input id="filter-input" type="text" placeholder="Type to filter users by name...">

    <p id="status"></p>
    <ul id="users-list"></ul>
  </main>
</body>
</html>
